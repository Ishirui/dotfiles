# The few packages that have to exist before the declarative tooling can run:
# git/curl to fetch things, jq for the Obsidian plugin installer chezmoi runs,
# chezmoi to deploy metapac's own group files, and metapac to install
# everything else. All of them are re-declared in the group files so they are
# not reported as unmanaged.
#
# The generic `package` module keeps this distro-agnostic (on Arch it delegates
# to pacman via community.general; on apt/dnf hosts the same task just works).
# The one Arch-specific corner — building metapac from the AUR — lives in
# 00-bootstrap-arch.yml.

- name: Bootstrap | Install the packages needed to reach metapac
  tags: software,core,bootstrap
  become: yes
  ansible.builtin.package:
    name: "{{ bootstrap_packages }}"
    state: present

- include_tasks: 00-bootstrap-arch.yml
  when: ansible_facts['os_family'] == "Archlinux"

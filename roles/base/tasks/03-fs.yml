- name: System | Filesystem | Remove extra directories in ~
  file:
    path: "/home/{{ ansible_user }}/{{ item }}"
    state: absent
  loop:
    - "Music"
    - "Pictures"
    - "Public"
    - "Templates"
    - "Videos"

- name: System | Filesystem | Create Media folder and subfolders
  file:
    path: "/home/{{ ansible_user }}/Media/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "Music"
    - "Pictures"
    - "Videos"
    - "Anime"
    - "TV"
    - "Movies"

# user-dirs.dirs itself is deployed by chezmoi from home/ — see 05-chezmoi.yml.
# The directories it points at are created above, since some are btrfs
# subvolume mountpoints.

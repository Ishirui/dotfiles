# Zed editor: install the app. Settings, keymap and the custom Catppuccin
# Macchiato theme are deployed by chezmoi from home/zed (19-chezmoi.yml);
# extensions are declared via auto_install_extensions in settings.json and
# installed by Zed on next launch.
#
# NOTE: editor-made config changes flow back to the repo with
# `chezmoi status` + `chezmoi re-add ~/.config/zed`. Language servers / LSP
# tooling are installed in 15-dev-tools.yml so they can be shared with
# OpenCode and the CLI.

# --- Install ----------------------------------------------------------------

- name: Zed | Install Zed
  tags: software,dev,editors,gui
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - zed

# chezmoi: fast, incremental deployment of the user configs in home/ (fish +
# starship, zed, obsidian) without re-running the full playbook.
#
# Ansible only installs chezmoi, points it at this repo's home/ source
# directory, and applies once. Day-to-day config changes are then just
# `chezmoi apply` (or `chezmoi apply <file>`) — Ansible stays for packages
# and system-level setup.

- name: Chezmoi | Install chezmoi (and jq, needed by the obsidian plugin installer)
  tags: software,core,cli,chezmoi
  become: true
  community.general.pacman:
    name:
      - chezmoi
      - jq
    state: present

- name: Chezmoi | Point chezmoi at this repo's home/ source directory
  tags: chezmoi
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — edit in dotfiles/roles/base/tasks/03b-chezmoi.yml.
      # Source state lives inside the dotfiles repo, so git operations happen
      # there directly (no `chezmoi init`/`chezmoi update`).
      sourceDir = "{{ playbook_dir }}/home"
    dest: "{{ dotconfig_path }}/chezmoi/chezmoi.toml"
    mode: "0644"

- name: Chezmoi | Apply user configs (fish, starship, zed, obsidian)
  tags: chezmoi
  ansible.builtin.command: chezmoi apply --force --verbose
  register: chezmoi_apply
  changed_when: (chezmoi_apply.stdout | length) > 0

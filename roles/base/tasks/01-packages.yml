# Packages are declared in home/dot_config/metapac/groups/ and installed by
# metapac. Ansible only points chezmoi at the repo, deploys the metapac config,
# and runs the sync.
#
# Only the metapac config is applied here. The rest of the user config is
# applied at the end of the run (05-chezmoi.yml), because much of it configures
# applications these packages provide.

- name: Packages | Point chezmoi at this repo's home/ source directory
  tags: chezmoi,packages
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — edit in dotfiles/roles/base/tasks/01-packages.yml.
      # Source state lives inside the dotfiles repo, so git operations happen
      # there directly (no `chezmoi init`/`chezmoi update`).
      sourceDir = "{{ playbook_dir }}/home"
    dest: "{{ dotconfig_path }}/chezmoi/chezmoi.toml"
    mode: "0644"

- name: Packages | Deploy the metapac config and group files
  tags: chezmoi,packages
  ansible.builtin.command: chezmoi apply --force --verbose {{ dotconfig_path }}/metapac
  register: metapac_config_apply
  changed_when: (metapac_config_apply.stdout | length) > 0

# metapac reads the row matching this machine's hostname and installs whatever
# is missing. It never removes anything; `metapac unmanaged` and `metapac clean`
# are deliberately left as manual operations.
- name: Packages | Install declared packages
  tags: software,packages
  become: no
  ansible.builtin.command: metapac sync --no-confirm
  register: metapac_sync
  changed_when: "'nothing to install' not in metapac_sync.stderr"

# Removals are the one piece of package state metapac cannot express, so they
# stay declared here. See roles/base/vars/packages.yml. The generic package
# module keeps this distro-agnostic; the pacman-specific `remove_nosave` option
# was dropped in the process (it only affected pacman's backup-file bookkeeping).
- name: Packages | Uninstall unwanted packages
  tags: software,packages
  become: yes
  ansible.builtin.package:
    name: "{{ removed_packages }}"
    state: absent

- name: Packages | Clean up leftover firefox profile data
  tags: software,packages
  become: yes
  become_user: "{{ username }}"
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    - "{{ dotconfig_path }}/mozilla/firefox"
    - "{{ dotcache_path }}/mozilla/firefox"

# Terminal stack: CLI tools, the Monaspace font, and the Yakuake/Konsole
# terminals. fish + starship configuration is deployed by chezmoi from home/
# (03b-chezmoi.yml); konsole/yakuake stay here for now (KDE scope).

# --- Install ----------------------------------------------------------------

- name: Terminal | Install CLI tools
  tags: software,tools,cli
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      # Some of these are CachyOS defaults
      - fish
      - otf-monaspace-nerd # Monaspace font from GitHub, with Nerd Font icons
      - fastfetch # For style
      - btop # Modern htop
      - eza # Modern ls
      - bat # Modern cat
      - micro # Modern nano
      - moor # Modern less
      - fd # Modern find
      - starship # Prompt
      - fzf
      - ripgrep
      - zoxide
      - tealdeer # Rust-based tldr implementation
      - aria2
      - tmux
      - rsync
      - nmap
      - gnupg
      - flatpak
      - btrbk
      - superfile
      - tree

- name: Terminal | Install terminal emulators
  tags: software,tools,gui
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - yakuake

# --- Configuration ----------------------------------------------------------
# fish/starship config: deployed by chezmoi from home/ — see 03b-chezmoi.yml.

- name: Terminal | Load terminal profiles
  tags: terminal
  copy:
    src: "{{ playbook_dir }}/kde/konsole/"
    dest: "{{ dotlocalshare_path }}/konsole/"

- name: Terminal | Load Konsole config
  tags: terminal
  copy:
    src: "{{ playbook_dir }}/kde/konsole/konsolerc"
    dest: "{{ dotconfig_path }}/konsolerc"

- name: Terminal | Load Yakuake config
  tags: terminal
  copy:
    src: "{{ playbook_dir }}/kde/konsole/yakuakerc"
    dest: "{{ dotconfig_path }}/yakuakerc"

- name: KDE | Terminal | Launch Yakuake at startup
  tags: terminal,kde
  copy:
    src: "files/autostart/org.kde.yakuake.desktop"
    dest: "{{ dotconfig_path }}/autostart/org.kde.yakuake.desktop"

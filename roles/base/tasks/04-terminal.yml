# Terminal stack: CLI tools, the Monaspace font, and the Yakuake/Konsole
# terminals. fish + starship configuration is deployed by chezmoi from home/
# (19-chezmoi.yml); konsole/yakuake stay here for now (KDE scope).

# --- Install ----------------------------------------------------------------

- name: Terminal | Install CLI tools
  tags: software,tools,cli
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      # Some of these are CachyOS defaults
      - fish
      - otf-monaspace-nerd # Monaspace font from GitHub, with Nerd Font icons
      - fastfetch # For style
      - btop # Modern htop
      - eza # Modern ls
      - bat # Modern cat
      - micro # Modern nano
      - moor # Modern less
      - fd # Modern find
      - starship # Prompt
      - fzf
      - ripgrep
      - zoxide
      - tealdeer # Rust-based tldr implementation
      - aria2
      - tmux
      - rsync
      - nmap
      - gnupg
      - flatpak
      - btrbk
      - superfile
      - tree
      - navi
      - ouch
      - visidata
      - jless
      - trippy

- name: Terminal | Install terminal emulators
  tags: software,tools,gui
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - yakuake

# --- Configuration ----------------------------------------------------------
# All of it is deployed by chezmoi from home/ — see 19-chezmoi.yml: fish and
# starship, the Konsole profile and colour scheme, konsolerc, yakuakerc, and
# the Yakuake autostart entry.

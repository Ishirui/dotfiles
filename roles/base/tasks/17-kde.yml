# KDE: package installs only (tweaks, scripts, Catppuccin themes). Every KDE
# config file is deployed or merged by chezmoi from home/ — the pointers are
# in the sections below.

# --- Install ----------------------------------------------------------------

- name: KDE | Install tweaks, KDE scripts
  tags: software,customization,KDE
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - plasmazones-bin
      - klassy-bin
      - kwin-effects-glass-git
      - plasma6-applets-thermal-monitor
      - plasma6-wallpapers-blurredwallpaper-git
      - wallpaper-engine-kde-plugin-git
      - plasma6-applets-eventcalendar
      - plasma6-applets-arch-update-notifier
      - plasma6-applets-panel-colorizer
      - vicinae-bin # Launcher (replaces KRunner's Alt+Space)

- name: KDE | Install catppuccin themes
  tags: software,customization,KDE,theme,cattpuccin
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - catppuccin-plasma-colorscheme-macchiato
      - catppuccin-plasma-colorscheme-mocha

# --- HID --------------------------------------------------------------------

# Keyboard and mouse settings (kcminputrc): declared and enforced by chezmoi +
# chezmoi_modify_manager — see home/dot_config/modify_private_kcminputrc.

# --- Keybinds ---------------------------------------------------------------

# Keybinds (kglobalshortcutsrc): deployed by chezmoi from home/ — see
# 19-chezmoi.yml.

# KWin Toggle HDR: the script (~/.local/bin/toggle_hdr.sh), its launcher and
# the Meta+Alt+H binding in kglobalshortcutsrc all come from chezmoi now.

# --- Desktops ---------------------------------------------------------------

# kwinrc (virtual desktops, desktop-change OSD, window decorations):
# merged into the live file by chezmoi + chezmoi_modify_manager — see
# home/dot_config/modify_private_kwinrc.

# Plasmazones config (krohnkite's replacement): deployed by chezmoi from
# home/ — see home/dot_config/plasmazones/.

# --- Window rules -----------------------------------------------------------

# Window rules (kwinrulesrc): deployed by chezmoi from home/.

# --- Applications -----------------------------------------------------------

# Application launchers (.desktop): deployed by chezmoi from home/.

# --- Theme ------------------------------------------------------------------

# kdeglobals (colour scheme blocks, fonts, widget style, icon theme):
# merged into the live file by chezmoi + chezmoi_modify_manager — see
# home/dot_config/modify_private_kdeglobals.
# Klassy config (klassy/klassyrc): deployed by chezmoi from home/.

# YAMIS icons and the Lavender Plasma theme are fetched from upstream by
# chezmoi — see home/.chezmoiexternal.toml.tmpl.

# The Plasma desktop theme name (plasmarc) is enforced by chezmoi — see
# home/dot_config/modify_private_plasmarc.


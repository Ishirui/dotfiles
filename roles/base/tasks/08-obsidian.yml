# Obsidian: install the app. The versioned per-vault config (settings, the
# custom Catppunite Encore theme, plugin settings) and the community plugin
# code download are handled by chezmoi from home/ (03b-chezmoi.yml): the
# config files deploy as regular files and a run_onchange script pulls plugin
# code (main.js/styles.css) from Obsidian's official registry whenever the
# enabled-plugin list changes.

# --- Install ----------------------------------------------------------------

- name: Obsidian | Install Obsidian
  tags: software,office,gui
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      - obsidian

# Deploy dev tool configs via chezmoi, from the repo's home/ source directory
# (fish + starship, zed, obsidian). This mirrors the Arch roles' 03b-chezmoi
# task: Ansible only installs chezmoi, points it at home/, and applies.

- name: Install chezmoi via Homebrew
  community.general.homebrew:
    name: chezmoi

- name: Point chezmoi at this repo's home/ source directory
  ansible.builtin.copy:
    content: |
      # Managed by Ansible — edit in dotfiles/roles/mac/tasks/configs.yml.
      # Source state lives inside the dotfiles repo, so git operations happen
      # there directly (no `chezmoi init`/`chezmoi update`).
      sourceDir = "{{ playbook_dir }}/home"
    dest: "{{ dotconfig_path }}/chezmoi/chezmoi.toml"
    mode: "0644"

- name: Apply user configs (fish, starship, zed, obsidian)
  ansible.builtin.command: chezmoi apply --force --verbose
  register: chezmoi_apply
  changed_when: (chezmoi_apply.stdout | length) > 0

- name: Deploy opencode config
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ dotconfig_path }}/opencode/{{ item | basename }}"
  loop:
    - "{{ playbook_dir }}/agents/opencode/opencode.jsonc"
    - "{{ playbook_dir }}/agents/opencode/tui.json"

- name: Deploy shared agent instructions to opencode
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/agents/AGENTS.md"
    dest: "{{ dotconfig_path }}/opencode/AGENTS.md"

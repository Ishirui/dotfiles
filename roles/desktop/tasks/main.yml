# Cuboid-specific setup: the IT87xx fan controller with its watercooling loop
# and the dual-DP display layout. Everything shared between the physical
# machines lives in the workstation role, and the tooling/package layer in
# base — this role only runs for the [desktop] inventory group.
- include_tasks: fancontrol.yml

- block:
    - name: KDE | Display | Configure displays
      tags: kde,display
      copy:
        src: "files/kwinoutputconfig.json"
        dest: "{{ dotconfig_path }}/kwinoutputconfig.json"

  rescue:
    - set_fact: task_failed=true

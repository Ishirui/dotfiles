# TLP configuration for Vertex, deployed to ~/.config/tlp/tlp.conf and
# symlinked from /etc/tlp.conf by the laptop role (03-power.yml). This file is
# the single source of truth: edit here, `chezmoi apply`, done — TLP picks the
# changes up on its next start.
#
# Only intentional deviations from TLP's defaults belong here; everything left
# unset keeps the built-in default. The fully-documented option reference
# ships with the tlp package — `tlp-stat -c` shows the effective config.
#
# NOTE: BAT0 on this machine (Legion Slim 5 14APH8) exposes no
# charge_control_*_threshold sysfs attribute, so START_CHARGE_THRESH_BAT0 /
# STOP_CHARGE_THRESH_BAT0 are inert. Battery capping is the Lenovo
# conservation mode instead (firmware toggle: legion_cli conservation-mode).
